name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.6)'
        required: true
        default: 'v1.0.6'
      release_name:
        description: 'Release Title'
        required: true
        default: 'ProxyPilot v1.0.6 - 现代化智能浏览器代理自动化套件'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release ProxyPilot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App & Extension Release Assets
        run: npm run build

      - name: Resolve Release Tag & Name
        id: release_vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            NAME="${{ github.event.inputs.release_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="ProxyPilot ${TAG} - 现代化智能浏览器代理自动化套件"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "name=${NAME}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          name: ${{ steps.release_vars.outputs.name }}
          body_path: RELEASE_NOTES_v1.0.6.md
          files: |
            dist-release/ProxyPilot-v1.0.6-chrome-extension.zip
            dist-release/proxy.pac
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
